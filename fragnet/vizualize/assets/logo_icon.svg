<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FragNet icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="frag" x1="40" y1="28" x2="92" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#2c7be5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2c7be5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2c7be5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded panel -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="111" height="111" rx="25.5" fill="none" stroke="#2c7be5" stroke-opacity="0.25"/>

  <!-- soft glow behind the highlighted fragment -->
  <circle cx="72" cy="52" r="40" fill="url(#glow)"/>

  <!-- ── bonds (edges) ── -->
  <g stroke-linecap="round">
    <!-- neutral graph -->
    <g stroke="#3c4a66" stroke-width="3.2">
      <line x1="36" y1="46" x2="36" y2="74"/>
      <line x1="36" y1="74" x2="60" y2="88"/>
      <line x1="36" y1="46" x2="22" y2="38"/>
      <line x1="36" y1="74" x2="22" y2="84"/>
    </g>
    <!-- highlighted fragment -->
    <g stroke="url(#frag)" stroke-width="4">
      <line x1="36" y1="46" x2="60" y2="32"/>
      <line x1="60" y1="32" x2="84" y2="46"/>
      <line x1="84" y1="46" x2="84" y2="74"/>
      <line x1="84" y1="74" x2="60" y2="88"/>
      <line x1="60" y1="32" x2="60" y2="14"/>
      <line x1="84" y1="46" x2="100" y2="38"/>
    </g>
  </g>

  <!-- ── atoms (nodes) ── -->
  <g>
    <!-- neutral nodes -->
    <g fill="#0d1424" stroke="#5a6b8c" stroke-width="3">
      <circle cx="36" cy="46" r="6.5"/>
      <circle cx="36" cy="74" r="6.5"/>
      <circle cx="22" cy="38" r="4.5"/>
      <circle cx="22" cy="84" r="4.5"/>
    </g>
    <!-- highlighted fragment nodes -->
    <g fill="url(#frag)" stroke="#0d1424" stroke-width="2.5">
      <circle cx="60" cy="32" r="7.5"/>
      <circle cx="84" cy="46" r="7.5"/>
      <circle cx="84" cy="74" r="7.5"/>
      <circle cx="60" cy="88" r="7.5"/>
      <circle cx="60" cy="14" r="5"/>
      <circle cx="100" cy="38" r="5"/>
    </g>
  </g>
</svg>
